name: Build and Release Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Required to create GitHub Releases

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Verify Flutter Version
        run: flutter --version

      - name: Create .env file
        working-directory: './Atayr Frontend/atayr'
        run: |
          echo "${{ secrets.FLUTTER_ENV }}" > .env

      - name: Setup Keystore
        working-directory: './Atayr Frontend/atayr/android'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties

      - name: Install Dependencies
        working-directory: './Atayr Frontend/atayr'
        run: flutter pub get

      - name: Build APK (split per ABI)
        working-directory: './Atayr Frontend/atayr'
        run: flutter build apk --release --split-per-abi

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

      - name: Get short commit hash
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          cp "./Atayr Frontend/atayr/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
             "./Atayr-arm64-${{ steps.commit.outputs.short_sha }}.apk"
          cp "./Atayr Frontend/atayr/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" \
             "./Atayr-armeabi-${{ steps.commit.outputs.short_sha }}.apk"
          cp "./Atayr Frontend/atayr/build/app/outputs/flutter-apk/app-x86_64-release.apk" \
             "./Atayr-x86_64-${{ steps.commit.outputs.short_sha }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.date.outputs.date }}
          name: "Atayr Build — ${{ steps.date.outputs.date }}"
          body: |
            ### 📱 Atayr APK — Auto Build

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Built at:** ${{ steps.date.outputs.date }} UTC

            ---
            **Which APK to download?**
            - **arm64** — Most modern phones (Samsung, Pixel, OnePlus, Xiaomi, etc.)
            - **armeabi** — Older phones
            - **x86_64** — Emulators / Chromebooks
          files: |
            ./Atayr-arm64-${{ steps.commit.outputs.short_sha }}.apk
            ./Atayr-armeabi-${{ steps.commit.outputs.short_sha }}.apk
            ./Atayr-x86_64-${{ steps.commit.outputs.short_sha }}.apk
          draft: false
          prerelease: false

