name: Build and Release Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Flutter Android builds require Java 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x' # Uses a recent stable Flutter version
          channel: 'stable'
          cache: true

      - name: Create .env file
        working-directory: './Atayr Frontend/atayr'
        run: |
          echo "${{ secrets.FLUTTER_ENV }}" > .env

      - name: Install Dependencies
        working-directory: './Atayr Frontend/atayr'
        run: flutter pub get

      - name: Build APK
        working-directory: './Atayr Frontend/atayr'
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atayr-Release-APK
          path: './Atayr Frontend/atayr/build/app/outputs/flutter-apk/app-release.apk'
          retention-days: 90
